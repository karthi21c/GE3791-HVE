var S, C;
var screen=document.getElementById("screen"), ladderbox=document.getElementById("ladderbox");
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fresh(){
  S={i:0,score:0,run:0,best:0,bonus:0,res:[],phase:"q",opts:Q.map(function(q){
    return shuffle([{t:q.a,ok:true}].concat(q.w.map(function(x){return{t:x,ok:false};})));})};
  newCard();
}
function newCard(){C={tries:0,wrong:{},done:false,ok:false,hint:false,ta:false,pts:0,bonus:0};}
function pts(q,tries,hint){var p=LEVELS[q.l].pts*(tries===1?1:0.5);if(hint)p-=5;return Math.max(0,Math.round(p));}
function setStats(){document.getElementById("score").textContent=S?S.score:0;document.getElementById("streak").textContent=S?S.run:0;}

function ladder(){
  var h='<ol class="ladder" aria-label="Progress, 15 questions in 3 levels">';
  for(var k=0;k<15;k++){
    var r=S&&S.res[k],cls="seg",lab="Question "+(k+1)+", "+LEVELS[Math.floor(k/5)].name+": ";
    if(r){cls+=r.first?" first":(r.ok?" second":" miss");lab+=r.first?"correct on the first try":(r.ok?"correct on the second try":"missed");}
    else if(S&&S.phase==="q"&&k===S.i){cls+=" now";lab+="current";}else lab+="not answered yet";
    h+='<li class="'+cls+'" data-l="'+Math.floor(k/5)+'" role="img" aria-label="'+lab+'"></li>';
  }
  h+='</ol><div class="bands">';
  for(var b=0;b<3;b++){
    var n=0;if(S)for(var m=b*5;m<b*5+5;m++)if(S.res[m]&&S.res[m].ok)n++;
    h+='<span><span>'+LEVELS[b].name+'</span><i>'+n+'/5</i></span>';
  }
  return h+'</div>';
}

function startScreen(){
  return '<section class="card">'+
   '<h2>Meena’s report is due in the morning. Help her decide.</h2>'+
   '<p>Answer 15 questions in three levels. Each one is about the case of the cooling tower bracket.</p>'+
   '<ul class="how">'+
   '<li><b>Three levels.</b> Base camp (10 points each), Field work (20) and Summit (30).</li>'+
   '<li><b>Two tries.</b> A wrong first answer lets you try once more for half the points.</li>'+
   '<li><b>Hint</b> costs 5 points. The <b>Tamil explanation</b> is always free.</li>'+
   '<li><b>Streak bonus.</b> Every third first-try answer in a row earns 5 points.</li>'+
   '<li>No timer. Take your time and talk it over with your team.</li></ul>'+
   '<details><summary>The case in brief</summary><p>Meena Rajan, a junior engineer in Tamil Nadu, finds that a supplier changed the steel in the fan bracket of a cooling tower. Her new calculation says the weld would last about 3 years, not 20. Her manager, Mr. Sundaram, asks her to write that the bracket is acceptable with regular inspection, because a delay would cost ₹18 lakh and leave 140 workers idle. An AI tool gives her a smooth sentence that hides the 3-year result. The tower will stand beside about 60 of the client’s workers. The report is due tomorrow morning.</p></details>'+
   '<div class="row"><button class="btn primary" id="start" type="button">Start Base camp</button></div></section>';
}

function questionScreen(){
  var q=Q[S.i],lv=LEVELS[q.l],o=S.opts[S.i];
  var h='<section class="card" aria-labelledby="qtext">'+
   '<div class="tag"><span class="lvl" data-l="'+q.l+'">'+lv.name+'</span>Question '+(S.i+1)+' of 15 · '+lv.pts+' points · '+q.k+' · '+q.co+'</div>'+
   '<p class="q" id="qtext">'+esc(q.q)+'</p><ul class="opts">';
  for(var j=0;j<o.length;j++){
    var cls="opt",mark="",dis=C.done||C.wrong[j];
    if(C.wrong[j]){cls+=" no";mark="Not this one";}
    if(C.done&&o[j].ok){cls+=" ok";mark="Correct";}
    if(C.done&&!o[j].ok&&!C.wrong[j])cls+=" dim";
    h+='<li><button type="button" class="'+cls+'" data-i="'+j+'"'+(dis?' disabled':'')+'><span class="ltr" aria-hidden="true">'+LET[j]+'</span><span class="otext">'+esc(o[j].t)+'</span>'+(mark?'<span class="mark">'+mark+'</span>':'')+'</button></li>';
  }
  h+='</ul>';
  if(C.hint&&!C.done)h+='<div class="hint"><b>Hint:</b> '+esc(q.hint)+'</div>';
  h+='<div id="fb" role="status" aria-live="polite">';
  if(!C.done&&C.tries===1)h+='<div class="fb no"><p><strong>Not quite.</strong> Try once more for half the points.</p></div>';
  if(C.done){
    var head;
    if(C.ok&&C.tries===1)head='Correct. +'+C.pts+' points.'+(C.bonus?' Streak bonus +'+C.bonus+'.':'');
    else if(C.ok)head='Correct on the second try. +'+C.pts+' points.';
    else head='Not this time. The correct answer is marked above. +0 points.';
    h+='<div class="fb '+(C.ok?'ok':'no')+'"><p><strong>'+head+'</strong></p><p>'+esc(q.why)+'</p>'+
       '<p><button class="btn" id="ta" type="button" aria-expanded="'+(C.ta?'true':'false')+'">தமிழில் / Tamil</button></p>'+
       (C.ta?'<p class="ta" lang="ta">'+esc(q.ta)+'</p>':'')+'</div>';
  }
  h+='</div><div class="row">';
  if(!C.done)h+='<button class="btn" id="hintbtn" type="button"'+(C.hint?' disabled':'')+'>Hint (−5 points)</button>';
  else h+='<button class="btn primary" id="next" type="button">'+(S.i===14?'See my result':(S.i%5===4?'Finish '+lv.name:'Next question'))+'</button>';
  return h+'</div></section>';
}

function stars(n){var s=n>=5?3:n>=3?2:n>=1?1:0,h='<div class="stars" aria-label="'+s+' of 3 stars">';for(var i=0;i<3;i++)h+='<span class="'+(i<s?'':'off')+'">★</span>';return h+'</div>';}
function lvlCorrect(b){var n=0;for(var m=b*5;m<b*5+5;m++)if(S.res[m]&&S.res[m].ok)n++;return n;}

function levelEndScreen(){
  var b=Math.floor((S.i)/5),n=lvlCorrect(b),nx=LEVELS[b+1];
  return '<section class="card"><h2>'+LEVELS[b].name+' complete</h2>'+stars(n)+
   '<p>You answered <b>'+n+' of 5</b> correctly. Your score so far is <b>'+S.score+'</b>.</p>'+
   '<p>Next: <b>'+nx.name+'</b>. '+nx.blurb+'</p><div class="row"><button class="btn primary" id="cont" type="button">Start '+nx.name+'</button></div></section>';
}

function endScreen(){
  var c=[lvlCorrect(0),lvlCorrect(1),lvlCorrect(2)],second=false,i;
  for(i=0;i<15;i++)if(S.res[i]&&S.res[i].ok&&!S.res[i].first)second=true;
  var badges=[["Fact Finder",c[0]>=4,"4 of 5 at Base camp"],["Clear Thinker",c[1]>=4,"4 of 5 at Field work"],["Summit Reached",c[2]>=3,"3 of 5 at Summit"],["Streak of 5",S.best>=5,"5 first-try answers in a row"],["Second Wind",second,"a right answer on the second try"]];
  var rank=S.score>=250?"Summit engineer":S.score>=150?"Field engineer":"Still climbing";
  var h='<section class="card"><h2>Your result: '+rank+'</h2><div class="sum">'+
   '<div><small>Score</small><span class="big">'+S.score+'</span></div>'+
   '<div><small>Streak bonus</small><b>+'+S.bonus+'</b></div>'+
   '<div><small>Correct in the end</small><b>'+(c[0]+c[1]+c[2])+' of 15</b></div></div>'+
   '<div class="sum">';
  for(i=0;i<3;i++)h+='<div><small>'+LEVELS[i].name+'</small>'+stars(c[i])+'</div>';
  h+='</div><div><b>Badges</b><ul class="badges" style="margin-top:8px">';
  badges.forEach(function(b){h+='<li class="'+(b[1]?'':'lock')+'">'+(b[1]?b[0]:b[0]+' · '+b[2])+'</li>';});
  h+='</ul></div>';
  var miss=[];for(i=0;i<15;i++)if(!S.res[i].first)miss.push(i);
  if(miss.length){
    h+='<details open><summary>Review '+miss.length+' question'+(miss.length>1?'s':'')+' to revisit</summary><div class="rev" style="margin-top:10px">';
    miss.forEach(function(k){var q=Q[k],lv=["var(--l1)","var(--l2)","var(--l3)"][q.l];
      h+='<article style="--lv:'+lv+'"><p><b>'+(k+1)+'. '+esc(q.q)+'</b></p><p>Answer: '+esc(q.a)+'</p><p>'+esc(q.why)+'</p><p lang="ta">'+esc(q.ta)+'</p><p class="tag">'+q.k+' · '+q.co+'</p></article>';});
    h+='</div></details>';
  } else h+='<p>You answered every question correctly on the first try.</p>';
  return h+'<div class="row"><button class="btn primary" id="again" type="button">Play again</button></div></section>';
}

function render(focusSel){
  ladderbox.innerHTML=ladder();
  screen.innerHTML=S.phase==="start"?startScreen():S.phase==="q"?questionScreen():S.phase==="levelEnd"?levelEndScreen():endScreen();
  setStats();
  if(focusSel){var el=screen.querySelector(focusSel);if(el)el.focus();}
}

function pick(j){
  if(C.done||C.wrong[j])return;
  var q=Q[S.i],o=S.opts[S.i][j];C.tries++;
  if(o.ok){
    C.done=true;C.ok=true;C.pts=pts(q,C.tries,C.hint);S.score+=C.pts;
    if(C.tries===1){S.run++;if(S.run>S.best)S.best=S.run;if(S.run%3===0){C.bonus=5;S.score+=5;S.bonus+=5;}}else S.run=0;
    S.res[S.i]={ok:true,first:C.tries===1};
    render("#next");
  }else{
    C.wrong[j]=true;
    if(C.tries>=2){C.done=true;C.ok=false;C.pts=0;S.run=0;S.res[S.i]={ok:false,first:false};render("#next");}
    else{S.run=0;render(".opt:not(:disabled)");}
  }
}
function next(){
  if(S.i===14){S.phase="end";render("#again");return;}
  if(S.i%5===4){S.phase="levelEnd";render("#cont");return;}
  S.i++;newCard();render(".opt");
}
screen.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.classList.contains("opt"))pick(+t.getAttribute("data-i"));
  else if(t.id==="hintbtn"){C.hint=true;render("#hintbtn");}
  else if(t.id==="ta"){C.ta=!C.ta;render("#ta");}
  else if(t.id==="next")next();
  else if(t.id==="cont"){S.i++;S.phase="q";newCard();render(".opt");}
  else if(t.id==="start"){fresh();render(".opt");}
  else if(t.id==="again"){S=null;S={phase:"start",res:[],score:0,run:0};render("#start");}
});
document.addEventListener("keydown",function(e){
  if(!S||S.phase!=="q"||C.done||e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key.toLowerCase(),j="1234".indexOf(k);if(j<0)j="abcd".indexOf(k);
  if(j>=0&&j<4&&document.activeElement.tagName!=="INPUT"){e.preventDefault();pick(j);}
});
S={phase:"start",res:[],score:0,run:0};
render();
})();
</script>
</body>
</html>
